services:
  - type: web
    name: matjakt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: matjakt-data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: MATJAKT_FRONTEND_ORIGIN
        # capacitor://localhost = iOS/Android-appens webview-origin (docs/IOS_RELEASE.md).
        value: https://matjakt.store,https://www.matjakt.store,https://adamfrom-code.github.io,capacitor://localhost
      - key: MATJAKT_APP_URL
        value: https://matjakt.store/app
      - key: MATJAKT_PREMIUM_CODE
        sync: false
      # Render terminates TLS at its own proxy, so X-Forwarded-For is set by
      # infrastructure we control and can be believed. Without this every
      # request would appear to come from the proxy and share one rate-limit
      # bucket - ten failed logins anywhere would lock out everyone.
      - key: MATJAKT_TRUST_PROXY
        value: "1"
      # Nightly price imports, Europe/Stockholm. Also fills the database on
      # the first boot after a deploy onto an empty disk - without this the
      # app served flat estimates because nothing ever populated it.
      - key: MATJAKT_GROCERY_SCHEDULE_ENABLED
        value: "1"
      - key: MATJAKT_MAX_SCRAPES
        value: "1"
      - key: PRIMAT_API_KEY
        sync: false
      - key: MATJAKT_ADMIN_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
