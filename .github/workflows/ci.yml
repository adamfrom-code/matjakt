name: CI

# Körs på varje pull request och varje push till main. Deploy-flödet
# (deploy.yml) väntar redan på "npm test"; det här jobbet är den fullständiga
# grinden: backend-svit i isolerad tempkatalog, frontend-tester, syntaxkontroll,
# hemlighetsskanning och att versionsnumren följs åt.
on:
  pull_request:
  push:
    branches: [main]
  # Merge queue: kön bygger PR:en mot main-HEAD som den kommer att se ut
  # vid merge och kräver att sviten är grön DÄR. Utan den här triggern
  # väntar kön på checkar som aldrig körs och varje PR fastnar.
  # deploy-backend rör den inte - den kräver github.event_name == 'push'.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# En körning per gren i taget (kö, ingen avbrytning): en äldre grön körning
# kan inte fyra deploy-hooken EFTER att en nyare push landat.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── K1 · LINT SOM FAILAR PÅ FEL, INTE PÅ FORMATERING ───────────────────
  #
  # Jobben nedan körde `node --check` och `compileall`. Det är SYNTAX: att
  # filen går att parsa. Ingen av dem säger något om att koden gör något
  # ANNAT än det som står skrivet - och det var precis där felen låg.
  #
  # Första ruff-körningen i det här repots historia hittade sex LITERALA
  # backsteg-tecken (0x08) i backend/scripts/secret_scan.py där någon menat
  # \b. Fem av hemlighetsskannerns mönster - GitHub-token, AWS-nyckel,
  # Anthropic/OpenAI-nyckel, Slack-token, Google-nyckel - krävde alltså ett
  # tecken som aldrig kommer, och kunde ALDRIG matcha. I ett publikt repo som
  # redan läckt en token i klartext en gång. Skannern körde grön varje gång:
  # en regex som aldrig matchar ser i loggen ut precis som en som inte hittade
  # något.
  #
  # Regelverken (pyproject.toml, eslint.config.js) räknar upp varje regel en
  # och en, aldrig som familj, och bara de som svarar på frågan "gör koden
  # något annat än det som står skrivet?". Radlängd, importordning, semikolon
  # och citattecken är AV med flit: en lint som failar på sjuhundra ställen
  # dag ett stängs av dag två, och då fångas inte heller de fel som betyder
  # något.
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # PINNAD version. En olåst linter ändrar grindens innebörd av sig
      # själv: nästa ruff-release kan lägga till en regel i en vald familj
      # och göra varje öppen PR röd utan att någon rört en rad kod. Samma
      # skäl som playwright==1.62.0 i K2. eslint är pinnad i package.json.
      - name: Installera ruff
        run: pip install --quiet "ruff==0.15.4"
      - name: ruff - fel som gör att koden gör något annat än det som står
        run: python -m ruff check .
      - run: npm ci
      # --max-warnings: no-unused-vars är en VARNING, inte ett fel. Elva av
      # dagens tolv ligger i frontend/app/app.js, som F-vågen refaktorerar
      # just nu, och en grind som är röd på filer man inte får röra blir
      # avstängd. Taket är det som gör att kategorin ändå inte kan tredubblas
      # i tysthet.
      - name: eslint - fel som gör att appen kastar i webbläsaren
        run: npx eslint . --max-warnings 20
      # Rapport, inte grind. Död kod är inte fel kod, och de 35 träffarna
      # ligger i frontendens och backendens konfliktfiler mitt under F-vågens
      # refaktorering. De syns som annotationer på PR:en; blockerar man dem
      # dag ett blir hela grinden avstängd dag två.
      - name: Död kod (oanvända importer och variabler - rapporteras)
        if: always()
        run: |
          python -m ruff check . --select F401,F841 --output-format concise \
            | sed 's/^/::warning::/' || true
  backend:
    name: Backend-tester (isolerad data, inga riktiga anrop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Kompilera allt
        run: python -m compileall -q backend
      # K6 - SKIP-BUDGETEN. unittest skrev "skipped=4" och gick vidare, så
      # dagen de blev fem såg likadan ut som dagen de var fyra, och dagen de
      # blev trettio också. MATJAKT_STRICT=1 fäller en körning där ett
      # överhoppat test har en orsak som inte står i
      # backend/tests/tillatna_skip.txt. "Noll skip" går inte att kräva -
      # några beror på vad som finns i miljön - men VILKA de är ska vara ett
      # beslut någon har läst, inte en siffra ingen tittar på.
      - name: Testsvit (tests/run.py sätter MATJAKT_TEST_MODE + tempkatalog)
        env:
          MATJAKT_STRICT: "1"
        run: python backend/tests/run.py

  # K6 - TÄCKNINGSMÄTNING. 1 500 tester lät mycket, men ingen visste vad de
  # rörde: utan en siffra är "vi har bra tester" en åsikt, och en hel modul
  # kan sakna svit tills den går sönder i drift.
  #
  # Golvet är satt UNDER dagens nivå med marginal, och det är med avsikt.
  # Ett golv på exakt dagens tal blir rött av varje ny modul som landar
  # minuten före sina tester, och en grind som är röd av normalt arbete
  # stängs av. Det här golvet blir rött av det som faktiskt betyder något:
  # en svit som slutar köra, eller en stor otestad yta som läggs till.
  #
  # Jobbet är MEDVETET inte en obligatorisk statuscheck i main:s ruleset.
  # Enligt planen rapporteras täckningen först en månad och blockerar sedan
  # på delta; tills dess ska ett tal som rör sig synas utan att stoppa elva
  # parallella paket. Adam lägger till det i rulesetet när talet har legat
  # stilla en månad.
  coverage:
    name: Täckning (rapporteras, golv under dagens nivå)
    runs-on: ubuntu-latest
    env:
      MATJAKT_STRICT: "1"
      # Browser-E2E:n körs i e2e-jobbet, som har en Chromium. Här finns ingen,
      # och skillnaden syns i talet: samma commit mäter 74,7 % med resorna och
      # 73,8 % utan. Ett golv går inte att sätta mot ett tal som beror på om en
      # webbläsare råkade gå att starta, så resorna stängs AV med flit och
      # talet är alltid det lägre. Planen säger samma sak med andra ord:
      # `coverage run backend/tests/run.py --exclude "*journey*"`.
      MATJAKT_E2E: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pip install --quiet coverage
      - name: Kör sviten under coverage
        run: coverage run --rcfile=.coveragerc backend/tests/run.py
      - name: Rapport och golv
        run: |
          coverage report --rcfile=.coveragerc | tail -40
          coverage report --rcfile=.coveragerc --fail-under="$(cat backend/tests/tackningsgolv.txt)"
      - name: Siffran i körningens sammanfattning
        if: always()
        run: |
          {
            echo "### Täckning, backend"
            echo ''
            echo '```'
            coverage report --rcfile=.coveragerc | tail -3
            echo '```'
            echo "Golv: $(cat backend/tests/tackningsgolv.txt) %"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend-tester och syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # tests/build-native.test.js kör byggskriptet (esbuild i devDependencies).
      - run: npm ci
      - run: node --check frontend/app/app.js
      - run: node --check frontend/app/sw.js
      - run: node --test

  security:
    name: Hemligheter och versioner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # K2: npm audit nedan behöver npm, inte node_modules - ingen npm ci här.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inga hemligheter i spårade filer
        run: python backend/scripts/secret_scan.py
      - name: .env är inte spårad
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then echo ".env är spårad av git"; exit 1; fi
      - name: Inga databasfiler är spårade
        # Backupkatalogen låg spårad i det publika repot 2026-08-31..09-06
        # (kontodatabas med e-post + lösenordshashar). Aldrig igen.
        run: |
          tracked=$(git ls-files '*.db' '*.sqlite' '*.sqlite3' '*.db-wal' '*.db-shm')
          if [ -n "$tracked" ]; then echo "Spårade databasfiler:"; echo "$tracked"; exit 1; fi
      - name: Inga genererade artefakter är spårade
        # audit_pricing.py skrev sitt resultat till repo-roten: varje agent
        # som körde prisauditen fick en diff där - den perfekta
        # konfliktgeneratorn när tjugo grenar är igång. Auditen skriver
        # numera till backend/data/audit/.
        # marketing/build/ låg dessutom spårad med 73 MB video TROTS raden
        # "marketing/" i .gitignore, för gitignore avspårar inget som redan
        # är spårat. Det är precis den sortens fel en regel i en fil inte
        # fångar och en grind i CI gör.
        run: |
          # K6: .coverage kom till med täckningsjobbet nedan, och den
          # skrivs i repo-roten av var och en som mäter lokalt - exakt samma
          # sorts konfliktgenerator som audit_flags.tsv var. Den står i
          # .gitignore, men gitignore avspårar inget som redan är spårat,
          # och det var precis så marketing/build/ kunde ligga kvar med 73 MB
          # video. Grinden är det som faktiskt håller.
          tracked=$(git ls-files '*.tsv' 'audit_*.json' 'backend/data/*' 'marketing/build/*' 'dist/*' 'build/*' '.coverage' '.coverage.*' 'htmlcov/*')
          if [ -n "$tracked" ]; then echo "Spårade genererade artefakter:"; echo "$tracked"; exit 1; fi
      # L9 - VERSIONEN STÅR INTE I KÄLLAN. Steget nedan kräver att de tre
      # ställena (sw.js CACHE_NAME, app.js?v=, styles.css?v=) bär en
      # platshållare och inget tal. Ett tal där är tre handredigerade rader som
      # måste vara lika, som kan SJUNKA när grenar mergas i annan ordning än de
      # skapades, och som varje gren som rör frontenden måste ändra - alltså en
      # garanterad konflikt. G5 låg DIRTY med grön CI i fyra timmar och D11
      # baserades om fyra gånger, enbart på de raderna.
      - name: Versionen står inte i källan
        run: python backend/scripts/check_frontend_version.py
      # K5 - LIKHET ÄR INTE FÄRSKHET, och färskheten kontrolleras på BYGGET.
      # Den första kontrollen krävde bara att de tre talen var LIKA. Den sa
      # ingenting om att de ska ha HÖJTS när frontenden ändrats, och det var
      # precis det som saknades: en PR som rörde frontend/app/app.js utan bump
      # var grön, Pages HTTP-cache serverade gammal app.js under samma URL, och
      # service workern behöll sin kopia tills CACHE_NAME bytte. Felet står
      # beskrivet överst i sw.js - "sidan var uppdaterad, telefonerna visade de
      # gamla tre veckotyperna" - och den enda kontrollen mot det var att någon
      # kom ihåg.
      #
      # Grinden frågar numera något starkare: ÄR cache-nyckeln det som ligger i
      # bygget? Byggsteget stämplar in eran plus en digest över varje fil under
      # app/, och skriptet räknar om digesten med en EGEN implementation och
      # jämför. En kontroll som bara frågade byggskriptet om dess eget svar
      # hade inte kontrollerat något; två implementationer som är eniga gör
      # regeln entydig. Ingen bas ur händelsen behövs längre - bygget bär
      # svaret i sig.
      - name: Cache-stämpeln i bygget är digesten av bygget
        run: |
          npm ci
          npm run build
          python backend/scripts/check_frontend_version.py --build dist/frontend
      - name: Juridiska platshållare (varning - släppgrind, inte byggfel)
        run: |
          if grep -rn 'class="placeholder"' frontend/*.html; then
            echo "::warning::Juridiska platshållare kvar i frontend/*.html - fylls i före publik release (docs/RELEASE.md)."
          else
            echo "Inga platshållare."
          fi

      # ── K2: beroendena ─────────────────────────────────────────────────
      #
      # backend/requirements.txt innehöll EN rad: playwright>=1.45. Basimagen
      # är pinnad till v1.62.0-jammy och bär EN Chromium. En ombyggnad av en
      # oförändrad commit kunde alltså dra en nyare Playwright in i en image
      # vars webbläsare den inte känner igen - "Executable doesn't exist" i
      # produktion, utan en enda kodändring.
      #
      # Låsfilen är nu genererad ur backend/requirements.in med hashar, och
      # de tre stegen nedan är det som gör låsningen till mer än en fil som
      # råkar ligga i repot.
      - name: Låsfilen går att installera i produktionsimagen (py3.10, glibc-linux)
        # DEN HÄR KONTROLLEN ÄR HELA POÄNGEN. CI kör Python 3.12 och
        # basimagen (jammy) kör 3.10. En låsfil som genererats på 3.12 kan
        # mycket väl peka ut ett hjul som inte finns för 3.10 - och det
        # upptäcks då först när Render bygger om, i produktion.
        #
        # pip download hämtar inget till bygget; det kontrollerar bara att
        # varje låst paket FINNS som hjul för imagens python och plattform,
        # och att sha256 stämmer. Låsfilen har hashar på varje rad, så pip
        # går automatiskt in i --require-hashes-läge: ett paket som saknas i
        # filen eller inte matchar sin hash avvisas.
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip download --no-cache-dir --only-binary=:all: \
            --python-version 3.10 --implementation cp --abi cp310 \
            --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 \
            --platform manylinux1_x86_64 --platform any \
            -r backend/requirements.txt -d "${RUNNER_TEMP}/hjul-py310"
          echo "Alla låsta paket finns som hjul för imagens python."
      # ── K2b: EN SÅRBARHET ÄR RÖD, EN BLIPP ÄR DET INTE ────────────────
      #
      # Båda stegen nedan ställer en fråga över nätet - till PyPI respektive
      # npm-registret - så båda kan falla av skäl som inte har med beroendena
      # att göra. 2026-09-11 gjorde de det, på main-committen d34d294
      # (körning 34650990118):
      #
      #     requests.exceptions.ConnectionError: ('Connection aborted.',
      #         ConnectionResetError(104, 'Connection reset by peer'))
      #
      # En omkörning av exakt samma commit blev grön. Ingenting var sårbart.
      # Men "Hemligheter och versioner" är en av fyra obligatoriska
      # statuscheckar OCH står sedan K4/K6 i releasekedjan (deploy-staging
      # behöver security), så den blippen blockerade varje öppen PR från varje
      # agent och stoppade hela deployen tills en människa körde om jobbet.
      #
      # audit_deps.py gör om frågan tre gånger med växande paus, och först när
      # samtliga försök föll på en KÄND transportsignatur blir det en
      # `::warning::` i stället för rött. Nedgraderingen kräver positivt bevis:
      # finns en tolkbar rapport är rapporten facit, och allt annat som
      # misslyckas - trasig låsfil, trasigt verktyg, borttagen flagga - är
      # fortfarande rött. Hela resonemanget står i skriptets docstring.
      #
      # Kommandona står i skriptet och inte här, för flaggorna som ger
      # maskinläsbar utdata hör ihop med tolken som läser den. Skiljer man dem
      # åt kan en ändring här tyst göra varje körning otolkbar, och då blir
      # varje körning ett "nätfall" - en grind som aldrig mer kan bli röd.
      # backend/tests/test_sarbarhetsgrind.py håller båda riktningarna.
      - name: Kända sårbarheter i python-beroendena (pip-audit)
        run: python backend/scripts/audit_deps.py pip
      - name: Kända sårbarheter i npm-beroendena (hög och uppåt)
        # --audit-level=high (satt i skriptet): MEDEL blockerar inte. En grind
        # som failar på varje moderate i ett transitivt Capacitor-beroende blir
        # avstängd inom en vecka, och då fångas inte heller de allvarliga.
        # npm audit behöver bara package-lock.json, inte node_modules.
        run: python backend/scripts/audit_deps.py npm

  e2e:
    name: "Browser-E2E (Playwright: konsumentresan, Premium/Stripe, hushållet med två personer)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # K2: det extra lösa `playwright` som stod här är borta. Det gjorde två
      # saker, båda fel: det upphävde låsfilen (pip fick välja fritt) och det
      # hade sprängt --require-hashes-läget som hasharna i låsfilen slår på -
      # ett löst namn utan hash får inte blandas med hashade krav. Paketet
      # står redan i backend/requirements.txt, låst till imagens version.
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Resorna i källform (konsument + hushåll)
        run: python backend/tests/run.py --pattern "test_*journey*"
      - name: Samma resor mot det byggda bundlet
        run: |
          npm ci
          npm run build
          MATJAKT_E2E_FRONTEND_DIR=dist/frontend python backend/tests/run.py --pattern "test_*journey*"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-skarmdumpar
          path: backend/tests/e2e/artifacts/
          if-no-files-found: ignore

  prisaudit:
    name: Prisaudit (manuell - resultatet publiceras som artifact)
    # Bara på begäran. Auditen behöver en prisdatabas med kedjedata och den
    # finns inte i en ren checkout; kör jobbet mot en återställd databas via
    # MATJAKT_DATA_DIR, eller kör POST /api/admin/pricing-audit mot
    # produktion. Poängen med jobbet är VART resultatet tar vägen: upp som
    # artifact, aldrig ner i en commit i repo-roten.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Kör auditen
        run: |
          set +e
          python backend/scripts/audit_pricing.py
          kod=$?
          set -e
          # 2 är skriptets egen fail-closed: tom prisdatabas. Det är en
          # saknad förutsättning, inte ett auditfel - inget att publicera,
          # men inget att larma om heller. 1 är en RÖD gate och ska synas.
          if [ "$kod" = "2" ]; then
            echo "::notice::Ingen prisdata i checkouten - auditen kördes inte."
            exit 0
          fi
          exit $kod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prisaudit
          path: backend/data/audit/
          if-no-files-found: ignore

  # ── K4 · STAGING FÖRE PRODUKTION ───────────────────────────────────────
  #
  # E2E kördes bara mot en process i CI och aldrig mot något som liknar
  # Render. Efter en deploy var kontrollen en människa som öppnade
  # /api/health i en flik - vilket fångar "servern svarar inte" och ungefär
  # inget annat.
  #
  # Samma bygge går nu upp i staging FÖRST, rökprovas där, och först när det
  # provet är grönt fyras produktionens hook. Det som fångas är exakt det som
  # inte går att se i en testsvit: en image som inte startar, en migration
  # som stannar på en disk med data, en miljövariabel som saknas, ett
  # beroende som inte finns i imagen.
  #
  # OM STAGING INTE ÄR UPPSATT hoppar rökprovet över sig själv och jobbet
  # blir grönt. Det är ett medvetet val: `deploy-backend` behöver det här
  # jobbet, och ett jobb som SKIPPAS gör varje jobb som behöver det skippat
  # med sig. En halvfärdig staging får inte stoppa produktionsdeployer.
  # docs/STAGING.md listar vad som återstår för att provet ska bli skarpt.
  deploy-staging:
    name: Deploy till staging
    # K6: `coverage` står med här, och det är inte kosmetik. `success()` på ett
    # jobb ser BARA jobben i dess egen `needs`. Utan raden hade en röd täckning
    # låtit backenden deployas - medan deploy.yml, som kräver att HELA
    # CI-körningen blev grön, hade vägrat publicera frontenden. Resultatet: ny
    # backend, gammal frontend, precis den sortens omaka par K3 byggdes för att
    # förhindra. Antingen går hela releasen, eller ingen del av den.
    #
    # Täckningsjobbet är ändå INTE en obligatorisk statuscheck i rulesetet: på
    # en PR syns det som rött utan att blockera, enligt planen ("rapporteras
    # första månaden, blockerar sedan på delta"). Raden gäller bara pushar till
    # main, där en halv release är värre än ingen.
    # K1: `lint` står med av exakt samma skäl som `coverage` ovan.
    needs: [lint, backend, frontend, security, e2e, coverage]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-staging
      cancel-in-progress: false
    outputs:
      triggad: ${{ steps.hook.outputs.triggad }}
    steps:
      - name: Trigga stagings deploy-hook för den gröna committen
        id: hook
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_STAGING_DEPLOY_HOOK" ]; then
            echo "triggad=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_STAGING_DEPLOY_HOOK saknas - stagingtjänsten är inte uppsatt än (docs/STAGING.md). Produktionsdeployen fortsätter som förut, utan stagingprov."
            exit 0
          fi
          case "$RENDER_STAGING_DEPLOY_HOOK" in *\?*) sep='&';; *) sep='?';; esac
          curl -fsS -X POST "${RENDER_STAGING_DEPLOY_HOOK}${sep}ref=${GITHUB_SHA}" -o /dev/null
          echo "triggad=true" >> "$GITHUB_OUTPUT"
          echo "Staging-deploy triggad för ${GITHUB_SHA}"

  smoke-staging:
    name: Rökprov mot staging (grinden före produktion)
    needs: [deploy-staging]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Steg-nivå `if`, inte jobb-nivå: ett HOPPAT JOBB gör deploy-backend
      # hoppat med sig, ett hoppat STEG lämnar jobbet grönt.
      - name: Vänta tills staging kör committen
        if: needs.deploy-staging.outputs.triggad == 'true'
        env:
          STAGING_HALSO_URL: ${{ vars.MATJAKT_STAGING_HEALTH_URL || 'https://matjakt-staging.onrender.com/api/health' }}
        run: |
          python backend/scripts/wait_for_deploy.py \
            --url "$STAGING_HALSO_URL" --commit "$GITHUB_SHA" --timeout 480 --interval 15
      - name: Rökprov
        if: needs.deploy-staging.outputs.triggad == 'true'
        env:
          STAGING_API: ${{ vars.MATJAKT_STAGING_API_URL || 'https://matjakt-staging.onrender.com/api' }}
        run: |
          python backend/scripts/smoke.py --url "$STAGING_API" \
            --commit "$GITHUB_SHA" --stripe-lage test
      - name: Utan staging finns inget prov att köra
        if: needs.deploy-staging.outputs.triggad != 'true'
        run: echo "::notice::Stagingtjänsten är inte uppsatt - se docs/STAGING.md."

  # ENDA vägen till Render. Auto-Deploy i Render-dashboarden ska vara AV;
  # den här hooken körs bara när alla jobb ovan är gröna på main. Saknas
  # secreten RENDER_DEPLOY_HOOK loggas det och inget deployas.
  #
  # K4: `smoke-staging` är tillagd i needs. Faller rökprovet mot staging blir
  # success() falskt, produktionens hook fyrar inte, health-gate hoppas över,
  # CI blir röd på main - och deploy.yml, som kräver en grön CI-körning,
  # publicerar därför ingen frontend heller. Ett trasigt bygge stannar i
  # staging.
  deploy-backend:
    name: Deploy backend till Render (bara grön main)
    needs: [backend, frontend, security, e2e, smoke-staging]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    outputs:
      # Säger VEM som startade deployen, inte OM någon gjorde det. Render har
      # "Auto-Deploy: After CI Checks Pass" påslaget i dashboarden och
      # deployar av sig självt; hooken är en andra väg som gör att vi kan
      # peka ut exakt SHA. Hälsogrinden körs oavsett - se motiveringen där.
      triggad: ${{ steps.hook.outputs.triggad }}
    steps:
      - name: Trigga Renders deploy-hook för exakt den gröna committen
        id: hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "triggad=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_DEPLOY_HOOK saknas i repo-secrets. Renders egen"
            echo "::notice::Auto-Deploy (After CI Checks Pass) gör jobbet i stället."
            echo "::notice::Hälsogrinden väntar ändå på att driften kör den här committen."
            exit 0
          fi
          # ref= gör att Render bygger DEN HÄR committen, inte grenspetsen
          # när hooken råkar tas emot. /api/health -> commit ska sedan
          # visa samma SHA-prefix.
          case "$RENDER_DEPLOY_HOOK" in *\?*) sep='&';; *) sep='?';; esac
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}${sep}ref=${GITHUB_SHA}" -o /dev/null
          echo "triggad=true" >> "$GITHUB_OUTPUT"
          echo "Render-deploy triggad för ${GITHUB_SHA}"

  # K3 — GRINDEN MELLAN BACKEND-DEPLOY OCH FRONTEND-DEPLOY.
  #
  # Render-hooken ovan och Pages-deployen i deploy.yml fyrade tidigare av
  # samma händelse. Pages är live på ~3 minuter, Render på ~5: det fanns ett
  # fönster på ett par minuter i VARJE release där den nya frontenden talade
  # med den gamla backenden, och klienten har inget API-versionskontrakt som
  # upptäcker det.
  #
  # Ordningen är nu backend -> hälsokontroll -> frontend, och den hålls av
  # två saker som båda måste gälla:
  #
  #   1. Det här jobbet ligger i CI-körningen och behöver deploy-backend.
  #   2. deploy.yml triggas av `workflow_run: types: [completed]` och kräver
  #      `conclusion == 'success'`. En CI-körning är inte "completed" förrän
  #      det HÄR jobbet är klart, och inte "success" om det failade.
  #
  # Alltså: ingen Pages-deploy förrän drift bevisligen kör committen. Failar
  # grinden blir CI röd på main och frontenden står kvar på föregående
  # version - gammal frontend mot gammal backend, vilket är ett par som har
  # fungerat, till skillnad från ny frontend mot gammal backend.
  #
  # Samma concurrency-grupp som deploy-backend: nästa push får inte fyra en
  # ny Render-deploy medan den här väntar på att den förra ska bli frisk.
  health-gate:
    name: Hälsokontroll (drift kör den gröna committen)
    needs: [deploy-backend]
    # KÖRS OAVSETT VEM SOM STARTADE DEPLOYEN. Villkoret var tidigare
    # "bara om VI triggade hooken", och eftersom RENDER_DEPLOY_HOOK aldrig
    # lades in i repots secrets hoppades grinden över vid varje merge -
    # tyst, och utan att något såg rött. Frontenden deployade alltså utan
    # att någon kontrollerat att backenden var uppe med samma commit, vilket
    # är precis det racet K3 fanns för att stänga.
    #
    # Render deployar av sig självt (Auto-Deploy: After CI Checks Pass), så
    # committen NÅR produktionen ändå - vi vet bara inte när. Grindens fråga
    # är inte "startade vi en deploy" utan "kör driften den här committen",
    # och den frågan är lika giltig oavsett vem som tryckte på knappen.
    #
    # Fail-closed med avsikt: kommer committen inte upp inom åtta minuter
    # blir CI röd och frontenden står kvar på föregående version. Gammal
    # frontend mot gammal backend är ett par som har fungerat, till skillnad
    # från ny frontend mot gammal backend.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Polla /api/health tills commit == GITHUB_SHA (max 8 min)
        env:
          # Repo-variabel om drift någon gång byter adress; annars produktion.
          HALSO_URL: ${{ vars.MATJAKT_HEALTH_URL || 'https://matjakt.onrender.com/api/health' }}
        run: |
          python backend/scripts/wait_for_deploy.py \
            --url "$HALSO_URL" --commit "$GITHUB_SHA" --timeout 480 --interval 15

  # ── K4 · RÖKPROV MOT PRODUKTION, OCH VÄGEN TILLBAKA ────────────────────
  #
  # health-gate ovan svarar på EN fråga: kör drift den här committen? Den
  # frågan kan mycket väl besvaras med ja av en release som startat, svarat
  # ok: true och tappat hela prisplattformen. Rökprovet ställer de andra
  # sex, och det gör det EFTER att backenden är live men FÖRE frontenden -
  # för deploy.yml startar först när hela den här körningen är klar.
  smoke-prod:
    name: Rökprov mot produktion
    needs: [deploy-backend, health-gate]
    if: needs.deploy-backend.outputs.triggad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Åtta prov mot den levande backenden
        env:
          PROD_API: ${{ vars.MATJAKT_API_URL || 'https://matjakt.onrender.com/api' }}
        run: |
          python backend/scripts/smoke.py --url "$PROD_API" \
            --commit "$GITHUB_SHA" --stripe-lage live

  # Faller hälsokontrollen eller rökprovet står produktionen med en trasig
  # release, och den enda vägen tillbaka var att någon var vaken och tryckte
  # "Deploy previous" i Renders dashboard.
  #
  # Villkoret är `always()` plus uttalade resultat, inte `failure()`.
  # Skillnaden spelar roll: en health-gate som failar gör smoke-prod HOPPAT,
  # och ett hoppat behov hade tystat ner det här jobbet i precis det läge där
  # det behövs allra mest. Här står det ordagrant vad som utlöser en
  # återställning - hälsogrinden eller rökprovet blev rött - och inget annat.
  #
  # Saknas RENDER_API_KEY/RENDER_SERVICE_ID säger skriptet det rakt ut och
  # jobbet blir rött: "kunde inte rulla tillbaka" får aldrig se ut som
  # "rullade tillbaka".
  rollback:
    name: Rulla tillbaka produktionen (bara vid rött rökprov)
    needs: [deploy-backend, health-gate, smoke-prod]
    if: >-
      always() && needs.deploy-backend.outputs.triggad == 'true'
      && (needs.health-gate.result == 'failure' || needs.smoke-prod.result == 'failure')
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tillbaka till föregående live-deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python backend/scripts/render_rollback.py --exclude "$GITHUB_SHA"
