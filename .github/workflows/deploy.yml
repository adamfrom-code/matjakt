name: Deploy frontend to GitHub Pages

# Körs när CI (ci.yml) är GRÖN på main - inte på pushen. En röd svit
# deployar varken backend (Render-hooken i ci.yml) eller frontend (här).
#
# K3 - ORDNINGEN MOT BACKENDEN. Den här workflowen är SIST i kedjan, inte
# först. `workflow_run: types: [completed]` fyrar när HELA CI-körningen är
# klar, och CI-körningen innehåller sedan K3 två jobb efter testerna:
#
#     deploy-backend  -> Render-hooken för exakt den gröna committen
#     health-gate     -> pollar /api/health tills commit == GITHUB_SHA
#
# Därför kan Pages inte längre gå live före backenden. Före K3 startade båda
# av samma händelse och Pages vann med ett par minuter - ett fönster i varje
# release där ny frontend talade med gammal backend.
#
# Det betyder också att `conclusion == 'success'` nedan numera betyder "koden
# är grön OCH drift kör den". Tas health-gate bort ur ci.yml öppnas fönstret
# igen, tyst; backend/tests/test_deploy_ordning.py håller fast kedjan.
#
# K6 - DEN MANUELLA VÄGEN ÄR BORTTAGEN. Här stod `workflow_dispatch:`, och
# den publicerade till matjakt.store med `npm test` som enda grind: ingen
# hemlighetsskanning, ingen versionskontroll, ingen browser-E2E, ingen
# kontroll av att backenden kör samma commit. `github.sha` kunde dessutom
# peka på vilken gren som helst, så vem som helst med skrivrättighet kunde
# publicera otestad kod från en featuregren till produktion med två klick,
# förbi hela grinden som resten av det här dokumentet handlar om.
#
# Det fanns en poäng med den: att kunna publicera om när en Pages-deploy
# misslyckats av sig själv. Den poängen finns kvar utan bakdörren - i
# Actions-vyn kör man "Re-run failed jobs" på den ursprungliga körningen,
# som behåller sin workflow_run-kontext och alltså fortfarande är den
# commit CI godkände.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # K6 - JOBBET `test` ÄR BORTTAGET. Det körde hela backendsviten en gång
  # till, på exakt samma SHA som CI redan hade godkänt, i ungefär två och en
  # halv minut. Grinden var redan passerad: den här workflowen startar bara
  # av en GRÖN CI-körning, och den checkar ut just den körningens head_sha.
  # En andra körning av samma tester på samma kod svarar på samma fråga en
  # gång till - och fördröjer varje release med den tiden.
  #
  # Villkoret som stod på `test` har flyttat hit, ordagrant utom att den
  # manuella vägen är borta: bara en GRÖN CI-körning för en PUSH till main
  # får publicera. PR-körningar släpps inte igenom, inte heller sådana från
  # forkar vars gren råkar heta main.
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # EXAKT den commit CI testade - inte main-HEAD när det här jobbet råkar
      # starta (en senare push kunde annars publiceras otestad).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Point the deployed site at the live backend
        # BÅDA filerna. admin.html glömdes, föll tillbaka på "/api" och fick
        # 404 från GitHub Pages - vilket admin.js visade som "Fel admin-token".
        # Misslyckas sed:en tyst är kontrollrummet trasigt utan att någon ser
        # det, så vi kontrollerar att ingen tom tagg blev kvar.
        run: |
          for f in frontend/app/index.html frontend/app/admin.html; do
            sed -i 's#<meta name="matjakt-api-url" content="">#<meta name="matjakt-api-url" content="https://matjakt.onrender.com/api">#' "$f"
            if grep -q '<meta name="matjakt-api-url" content="">' "$f"; then
              echo "::error::$f har kvar en tom matjakt-api-url - deployen skulle peka på fel backend"; exit 1
            fi
            grep -q 'matjakt-api-url" content="https://' "$f" || {
              echo "::error::$f saknar matjakt-api-url helt"; exit 1; }
          done
      # Bundlad + minifierad kopia i dist/frontend (källorna orörda):
      # samma kod, en fil i stället för tretton moduler.
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/frontend
      - uses: actions/deploy-pages@v4
        id: deployment
