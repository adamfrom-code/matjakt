<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f3ea">
  <!-- Matjakt är stängt för allmänheten under utveckling. Den här sidan
       avslöjar ingenting om produkten. Verifieringen sker på servern - det
       finns ingen hemlighet i den här filen att hitta. noindex är hygien,
       inte säkerhet; säkerheten är att servern inte lämnar ut data utan
       godkänd token. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Matjakt</title>
  <link rel="icon" href="app/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f3ea;--primary:#173b2a;--accent:#f28c28;--border:rgba(22,32,25,.14);--muted:#5c665d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:"DM Sans",system-ui,sans-serif;color:var(--primary)}
    main{width:min(320px,calc(100vw - 48px))}
    h1{font-family:"Fraunces",serif;font-weight:700;font-size:34px;text-align:center;margin:0 0 28px;letter-spacing:-.02em}
    h1 span{color:var(--accent)}
    label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
    input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:var(--primary)}
    input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--primary);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
    button:hover{background:#24563e}
    button[disabled]{opacity:.6;cursor:default}
    .error{min-height:20px;margin:12px 0 0;text-align:center;font-size:14px;color:#bf3636}
  </style>
</head>
<body>
  <main>
    <h1>Matjakt<span>.</span></h1>
    <form id="gateForm" autocomplete="off">
      <label for="user">Användarnamn</label>
      <input id="user" name="username" autocomplete="username" required>
      <label for="code">Lösenord</label>
      <input id="code" name="code" type="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Logga in</button>
      <p class="error" id="gateError" role="alert"></p>
    </form>
  </main>
  <script>
    (function () {
      var API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "" : "https://matjakt.onrender.com";
      var stored = null;
      try { stored = localStorage.getItem("matjakt-gate"); } catch (e) {}
      if (stored) {
        // Redan godkänd? Verifiera mot servern innan vidareslussning - en
        // hemsnickrad token i localStorage öppnar ingenting.
        fetch(API + "/api/gate/check", { headers: { "X-Gate-Token": stored } })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d && d.ok) location.replace("app/");
            else try { localStorage.removeItem("matjakt-gate"); } catch (e) {}
          }).catch(function () {});
      }
      document.getElementById("gateForm").addEventListener("submit", function (event) {
        event.preventDefault();
        var button = document.getElementById("submitBtn");
        var error = document.getElementById("gateError");
        button.disabled = true; error.textContent = "";
        fetch(API + "/api/gate/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("user").value,
            code: document.getElementById("code").value,
          }),
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok && res.d.gateToken) {
              try { localStorage.setItem("matjakt-gate", res.d.gateToken); } catch (e) {}
              location.replace("app/");
            } else {
              error.textContent = (res.d && res.d.error) || "Fel användarnamn eller kod";
              button.disabled = false;
            }
          })
          .catch(function () {
            error.textContent = "Kunde inte nå servern. Försök igen.";
            button.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
