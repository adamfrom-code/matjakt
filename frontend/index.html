<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f3ea">
  <meta name="description" content="Matjakt planerar veckans middagar efter din budget och räknar ut var de blir billigast - med riktiga butikspriser.">
  <title>Matjakt</title>
  <link rel="icon" href="app/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f7f4;--primary:#146c43;--accent:#146c43;--border:#e6e9e6;--muted:#6b756e}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:"Manrope",system-ui,sans-serif;color:var(--primary)}
    main{width:min(320px,calc(100vw - 48px))}
    h1{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-weight:700;font-size:34px;text-align:center;margin:0 0 28px;letter-spacing:-.02em}
    h1 span{color:var(--accent)}
    label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
    input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;font:inherit;font-size:16px;color:var(--primary)}
    input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--primary);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
    button:hover{background:#24563e}
    button[disabled]{opacity:.6;cursor:default}
    .lead{margin:0 0 26px;text-align:center;font-size:16px;line-height:1.5;color:var(--muted)}
    a.open{display:block;text-align:center;text-decoration:none;margin-top:0;padding:14px;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:600}
    a.open:hover{background:#24563e}
    .legal{margin:22px 0 0;text-align:center;font-size:13px;color:var(--muted)}
    .legal a{color:var(--muted)}
  </style>
  <!-- Besöksstatistik utan kakor: "plausible:matjakt.store" eller "umami:<website-id>". Tomt = av. -->
  <meta name="matjakt-traffic" content="">
  <script src="traffic.js" defer></script>
</head>
<body>
  <main>
    <h1>Matjakt<span>.</span></h1>
    <p class="lead">Säg din budget. Matjakt väljer veckans middagar och räknar ut var de blir billigast - med riktiga priser från butikerna nära dig.</p>
    <a class="open" id="openApp" href="app/">Öppna Matjakt</a>
    <p class="legal"><a href="integritetspolicy.html">Integritetspolicy</a> · <a href="anvandarvillkor.html">Användarvillkor</a> · <a href="mailto:adamfrom@icloud.com">Support</a></p>
  </main>
  <script>
    // Djuplänkar (?verify=, ?reset=, ?invite=) som landar här följer med in
    // i appen - query-strängen får aldrig tappas på vägen.
    (function () {
      var link = document.getElementById("openApp");
      if (location.search) link.setAttribute("href", "app/" + location.search);
    })();
  </script>
</body>
</html>
