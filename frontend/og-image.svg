<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ECEEEF"/>
  <rect x="0" y="0" width="1200" height="10" fill="#8A1F42"/>
  <text x="88" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="5.7" fill="#626B6F">MATJAKT</text>
  <line x1="88" y1="168" x2="1112" y2="168" stroke="#B3BBBE" stroke-width="1"/>
  <text x="88" y="286" font-family="Georgia, Times New Roman, serif" font-size="68" fill="#16191B">Säg vad maten får kosta.</text>
  <text x="88" y="368" font-family="Georgia, Times New Roman, serif" font-size="68" fill="#16191B">Vi planerar veckan och visar</text>
  <text x="88" y="450" font-family="Georgia, Times New Roman, serif" font-size="68" fill="#16191B">var den blir billigast.</text>
  <line x1="88" y1="506" x2="1112" y2="506" stroke="#CBD1D3" stroke-width="1"/>
  <text x="88" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#5A6367">Riktiga butikspriser hos Willys, Hemköp och City Gross</text>
</svg>
